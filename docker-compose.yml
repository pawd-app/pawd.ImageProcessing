services:
  app:
    image: pawdimageworker:latest
    container_name: jobsimageprocessuploadvalidation
    build:
      context: ..
      dockerfile: ImageProcessWorker/Dockerfile
    environment:
      # ── Application settings ──────────────────────────────────────────────────
      ConnectionStrings__DefaultConnection: "Server=192.168.8.160;Port=3306;Database=pawddev;Uid=root;Pwd=TgvYL/k6aRnPKF7U8G0bkAHDx++8P0Xs"
      RabbitMq__HostName: "192.168.8.160"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__QueueName: "IMAGE_UPLOAD_VALIDATION"
      S3Settings__ServiceURL: "http://192.168.8.160:8333"
      S3Settings__AccessKey: "GK47bfc18bd9cc896f3683de60"
      S3Settings__SecretKey: "0d87b64e43eaf1074015aebe74c484e58ab9e36b9341db9d813592a53d7155e8"
      S3Settings__UploadBucketName: "pawd-dev-app-data"
