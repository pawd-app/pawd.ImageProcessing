      S3Settings__UploadCompleteBucketName: "1abb67c6-1b4d-4650-92fb-a84b4a8e9b45"

      # ── (Optional) Microsoft.Extensions.Logging bridge ─────────────────────────
      LOGGING__LOGLEVEL__DEFAULT: "Information"
      LOGGING__LOGLEVEL__MICROSOFT__ASPNETCORE: "Warning"

      # ── Serilog “Using” (load these assemblies) ─────────────────────────────────
      SERILOG__USING__0: "Serilog.Sinks.Console"
      SERILOG__USING__1: "Serilog.Sinks.File"
      SERILOG__USING__2: "Serilog.Sinks.OpenObserve-KKP"    # match your NuGet/assembly
      SERILOG__USING__3: "Serilog.Enrichers.Environment"
      SERILOG__USING__4: "Serilog.Enrichers.Thread"

      # ── Global levels ─────────────────────────────────────────────────────────
      SERILOG__MINIMUMLEVEL__DEFAULT: "Information"
      SERILOG__MINIMUMLEVEL__OVERRIDE__MICROSOFT: "Information"
      SERILOG__MINIMUMLEVEL__OVERRIDE__SYSTEM: "Warning"

      # ── Sink 0: Console ────────────────────────────────────────────────────────
      SERILOG__WRITETO__0__NAME: "Console"
      SERILOG__WRITETO__0__RESTRICTEDTOMINIMUMLEVEL: "Information"

      # ── Sink 1: File ────────────────────────────────────────────────────────────
      SERILOG__WRITETO__1__NAME: "File"
      SERILOG__WRITETO__1__ARGS__path: "logs/pawdimageworker.txt"
      SERILOG__WRITETO__1__ARGS__rollingInterval: "Hour"
      SERILOG__WRITETO__1__RESTRICTEDTOMINIMUMLEVEL: "Warning"

      # ── Sink 2: OpenObserve ─────────────────────────────────────────────────────
      SERILOG__WRITETO__2__NAME: "OpenObserve"
      SERILOG__WRITETO__2__ARGS__apiUrl:       "http://192.168.8.160:5080"
      SERILOG__WRITETO__2__ARGS__organization: "default"
      SERILOG__WRITETO__2__ARGS__username:     "john@johnwmoody.co.uk"
      SERILOG__WRITETO__2__ARGS__key:          "Pswd_Elena2409-"
      SERILOG__WRITETO__2__ARGS__streamName:   "pawdImageWorker"
      SERILOG__WRITETO__2__RESTRICTEDTOMINIMUMLEVEL: "Information"
    restart: unless-stopped